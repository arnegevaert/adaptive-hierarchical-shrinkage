[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adhs"
version = "0.1.4"
description = "Adaptive Hierarchical Shrinkage"
readme = "README.md"
authors = [
    { name = "Arne Gevaert", email = "arne.gevaert@ugent.be" },
    { name = "Markus Loecher" },
    { name = "Bastian Pfeifer" }
]
license-files = [ "LICENSE" ]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
]
dependencies = [
    "numpy >= 1.23.0,<2.0.0",
    "scipy >= 1.10.0",
    "pandas >= 2.3.3",
    "scikit-learn >= 1.2.1",
]
requires-python = "==3.10.*"

[tool.setuptools]
packages = ["adhs"]

[project.optional-dependencies]
dev = [
    "bumpver"
]
experiments = [
    "matplotlib",
    "seaborn",
    "tqdm",
    "ipykernel",
    "imodels",
    "pmlb",
    "shap == 0.42.0",
    "scikit-learn == 1.2.*",
    "adhs",
]

[project.urls]
Homepage = "https://github.com/arnegevaert/adaptive-hierarchical-shrinkage"

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
adhs = { workspace = true }
