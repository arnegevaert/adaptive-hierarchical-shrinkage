[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adhs"
version = "0.1.3"
description = "Adaptive Hierarchical Shrinkage"
readme = "README.md"
authors = [
    { name = "Arne Gevaert", email = "arne.gevaert@ugent.be" },
    { name = "Markus Loecher" },
    { name = "Bastian Pfeifer" }
]
license-files = [ "LICENSE" ]
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy >= 1.23.0,<2.0.0",
    "scipy >= 1.10.0",
    "pandas >= 2.3.3",
    "scikit-learn >= 1.2.1",
]
requires-python = ">=3.13"

[tool.setuptools]
packages = ["adhs"]

[project.optional-dependencies]
dev = [
    "bumpver"
]
experiments = [
    "matplotlib",
    "seaborn",
    "tqdm",
    "ipykernel",
    "imodels",
    "pmlb",
    "shap >= 0.42.0",
    "adhs",
]

[project.urls]
Homepage = "https://github.com/arnegevaert/adaptive-hierarchical-shrinkage"

[tool.bumpver]
current_version = "0.1.3"
version_pattern = "MAJOR.MINOR.PATCH"
commit_message = "Bump version {old_version} -> {new_version}"
commit = true
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = ['current_version = "{version}"', 'version = "{version}"']
"adhs/__init__.py" = ["{version}"]

[tool.uv.workspace]
members = [
    ".",
]

[tool.uv.sources]
adhs = { workspace = true }
